[project]
name = "redforge-agents"
version = "0.1.0"
description = "RedForge Agents — autonomous red-teamer for tool-using AI agents: find, prove, patch, verify"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "anthropic>=0.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]
demo = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
redforge-agents = "redforge_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redforge_agents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
